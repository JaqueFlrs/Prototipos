<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de revisión de Facturación por Recorridos</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--txt:#2b3a38;--mut:#6f7d7a;--line:#e6e2d8;--soft:#faf8f3;
  --brand:#2f8f83;--brand-2:#5bb5a2;--brand-soft:#e3f2ee;--ok:#2f7d62;--ok-soft:#e8f4ee;--warn:#a8742a;--warn-soft:#fbf1dd;--sql:#24332f;--sql-t:#d6e6e1;
  --shadow:0 1px 2px rgba(60,70,60,.06),0 6px 18px rgba(60,70,60,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141c1b;--card:#1c2625;--txt:#e6efec;--mut:#9bada8;--line:#2b3836;--soft:#212d2b;
  --brand:#6fd0c0;--brand-2:#8fe0cf;--brand-soft:#223a37;--ok:#7fd9ae;--ok-soft:#1d3329;--warn:#e8bd6f;--warn-soft:#352c18;--sql:#0f1716;--sql-t:#d6e6e1;
  --shadow:none}}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:clamp(14px,1.6vw,15.5px)/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-wrap:anywhere}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.ttl{font-weight:700;font-size:15px}
.crumb{color:var(--mut);font-size:13px;margin-left:auto}
.crumb a{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
main{max-width:1080px;margin:0 auto;padding:24px 16px 72px}
h1{font-size:clamp(21px,4.5vw,27px);margin:0 0 6px;letter-spacing:-.01em;line-height:1.2}
h2{font-size:clamp(19px,4vw,23px);margin:0 0 6px;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--mut);margin:0 0 18px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--txt);border-radius:14px;padding:11px 15px;margin:0 0 20px;font-size:13.5px}
.aviso b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.fl{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit;transition:transform .12s,border-color .12s}
.fl:hover{transform:translateY(-2px);border-color:var(--brand)}
.num{flex:0 0 38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.fl .t{font-weight:650;line-height:1.3}.fl .s{font-size:12.5px;color:var(--mut);line-height:1.4;margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.row:hover{border-color:var(--brand)}
.row .num{flex:0 0 32px;height:32px;border-radius:10px;font-size:13px}
.row .t{flex:1;font-weight:600}
.arrow{color:var(--mut);font-size:18px}
.info{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:14px 0}
.info>div{padding:13px 16px;border-right:1px solid var(--line)}
.info>div:last-child{border-right:0}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 0 3px}
.info p{margin:0;font-size:13.5px}
.steps{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sh,.st{display:grid;grid-template-columns:40px 1fr 2fr 1.7fr;gap:16px;padding:13px 16px;align-items:start}
.sh{background:var(--soft);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.st{border-bottom:1px solid var(--line)}.st:last-child{border-bottom:0}
.st .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.st .donde{color:var(--mut);font-size:13px}
.st .accion{font-weight:560}
.st .pasa{background:var(--ok-soft);border-radius:10px;padding:8px 12px;font-size:13.5px}
.mlbl{display:none}
.sql{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sql);color:var(--sql-t);border-radius:10px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;font-weight:400;overflow-x:auto}
.ok{display:flex;gap:10px;align-items:center;background:var(--ok-soft);border-radius:14px;padding:12px 16px;margin-top:14px}
.ok .lbl{margin:0;color:var(--ok);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (max-width:860px){
  .info{grid-template-columns:1fr}.info>div{border-right:0;border-bottom:1px solid var(--line)}.info>div:last-child{border-bottom:0}
  .sh{display:none}
  .st{grid-template-columns:32px 1fr;gap:8px 12px;padding:14px}
  .st>div:not(.n){grid-column:2}
  .mlbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
  .crumb{margin-left:0;width:100%}
  .ok{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (max-width:480px){
  main{padding:18px 12px 56px}
  .top .in{padding:10px 12px}
  .row .chip{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo">F</div><div class="ttl">Guía de revisión · Facturación por Recorridos</div><div class="crumb" id="crumb"></div></div></header>
<main id="app"></main>
<script>
"use strict";
const D = {"generado":"2026-10-20","flujos":[{"nombre":"Antes de empezar","desc":"Confirmar el ambiente y dejar listos los recorridos de prueba","caminos":[{"nombre":"Confirmar que el ambiente es de calidad","obj":"Evitar timbres, facturas o pólizas reales.","datos":"Servidor y base de datos del ERP bajo prueba.","aprueba":"El responsable técnico confirma por escrito que es calidad y que el timbrado apunta a pruebas.","antes":[],"pasos":[{"donde":"Ambiente / responsable técnico","accion":"Preguntar el servidor y la base de datos que usa el ERP y anotarlos.","esperado":"Se identifica el ambiente y el responsable confirma que es de calidad."},{"donde":"ERP → Facturación → Catálogos → Parámetros de Configuración","accion":"Abrir la pantalla sin modificar nada y consultar que el timbrado sea de pruebas.","esperado":"El timbrado apunta a pruebas. Si no se puede confirmar, no continuar."}]},{"nombre":"Registrar los parámetros que afectan recorridos","obj":"Conocer el valor original para poder restaurarlo al terminar.","datos":"Parámetros de conversión de importes al facturar, crédito, centro de costo, periodicidad, redondeo de impuestos y ajuste a 2 decimales.","aprueba":"Cada parámetro tiene su valor original anotado.","antes":[],"pasos":[{"donde":"ERP → Facturación → Catálogos → Parámetros de Configuración","accion":"Capturar pantalla completa de los parámetros y anotar el valor de cada uno de los que se mencionan en Datos a usar.","esperado":"Todos los valores quedan registrados antes de probar."},{"donde":"Base de datos, solo lectura","accion":"SELECT TOP 200 Parametro, Valor FROM SisParametrosValores ORDER BY Parametro","esperado":"Se obtiene la lista. Si un parámetro no aparece, anotarlo como no existe."}]},{"nombre":"Preparar los recorridos de prueba","obj":"Tener recorridos para cada situación que se va a revisar.","datos":"Un cliente A y un cliente B, una ruta con tarifa en pesos, una ruta con tarifa en dólares, una ruta con varios conceptos e impuestos distintos, un recorrido terminado, uno sin salida, uno con subtotal cero y uno marcado como no facturable.","aprueba":"Existe al menos un recorrido de cada tipo y están anotados sus números.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Rutas","accion":"Revisar que las rutas de prueba tengan sus conceptos de facturación, importes en pesos y en dólares, e impuestos.","esperado":"Cada ruta muestra sus conceptos con importe e impuesto."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Crear con autorización los recorridos que falten, uno por cada situación de la lista.","esperado":"Cada recorrido aparece en el listado con su cliente, ruta y moneda."},{"donde":"Registro de la guía","accion":"Anotar el número de cada recorrido y para qué situación sirve.","esperado":"Queda una tabla de recorridos de prueba."}]}]},{"nombre":"Qué recorridos se pueden facturar","desc":"Quién aparece en la lista de pendientes y quién no","caminos":[{"nombre":"Recorrido normal terminado","obj":"Confirmar que un recorrido completo aparece para facturar.","datos":"Recorrido terminado, facturable, no cancelado, en pesos.","aprueba":"Aparece en la lista y se puede seleccionar.","antes":["Preparar los recorridos de prueba"],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir el cliente y dejar el filtro de tipo de recorrido en terminados.","esperado":"La tabla muestra recorridos pendientes de ese cliente."},{"donde":"Misma pantalla","accion":"Buscar el recorrido terminado de prueba.","esperado":"Aparece con su importe y se puede marcar."}]},{"nombre":"Recorrido que nunca salió","obj":"Ver si se puede facturar un recorrido sin salida ni llegada.","datos":"Recorrido sin salida registrada, facturable.","aprueba":"Se anota si aparece o no con el filtro en todos y con el filtro en terminados.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir el cliente y dejar el filtro en todos los recorridos.","esperado":"Revisar si el recorrido sin salida aparece."},{"donde":"Misma pantalla","accion":"Cambiar el filtro a solo terminados.","esperado":"El recorrido sin salida debe desaparecer. Anotar si se queda."}]},{"nombre":"Recorrido con subtotal cero","obj":"Ver qué pasa al facturar algo sin importe.","datos":"Recorrido con subtotal cero.","aprueba":"Se anota si aparece en la lista y qué mensaje da al guardar la factura.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Marcar solo el recorrido con subtotal cero y presionar Aceptar.","esperado":"Anotar el mensaje. Se espera que no deje guardar."}]},{"nombre":"Recorrido no facturable o cancelado","obj":"Confirmar que no se ofrecen para facturar.","datos":"Recorrido marcado como no facturable y recorrido cancelado.","aprueba":"Ninguno aparece en la lista de pendientes.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir el cliente y buscar ambos recorridos.","esperado":"Ninguno de los dos aparece."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Abrir el recorrido cancelado y revisar si conserva la marca de pendiente de facturar.","esperado":"Anotar la marca, porque algunos reportes cuentan solo esa marca."}]},{"nombre":"Moneda de la lista","obj":"Evitar mezclar pesos y dólares en una misma factura.","datos":"Un recorrido en pesos y otro en dólares del mismo cliente.","aprueba":"Cada moneda se lista por separado.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Cambiar el filtro de moneda entre pesos y dólares.","esperado":"Cada recorrido aparece solo en su moneda."}]}]},{"nombre":"Importes, tarifas e impuestos","desc":"Que lo que se cobra coincida con la tarifa y con los impuestos","caminos":[{"nombre":"Tarifa del recorrido contra tarifa de la ruta","obj":"Detectar recorridos cuyo importe ya no coincide con la ruta.","datos":"Ruta con varios conceptos y recorridos creados antes y después de cambiar la tarifa.","aprueba":"Se identifica qué recorridos conservan la tarifa vieja y se confirma con el área que es lo esperado.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Rutas","accion":"Abrir la ruta y anotar sus conceptos e importes actuales.","esperado":"Se ven los conceptos con su importe."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Abrir un recorrido de esa ruta creado hace tiempo y comparar sus conceptos contra la ruta.","esperado":"Anotar las diferencias. Un cambio de tarifa no actualiza recorridos ya creados."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Crear un recorrido nuevo de la misma ruta.","esperado":"Trae la tarifa vigente de la ruta."}]},{"nombre":"Combinaciones de impuestos","obj":"Que el total sea correcto con cada tipo de impuesto.","datos":"Conceptos con IVA 16%, IVA 8%, retención 4%, tasa 0% y no objeto.","aprueba":"Subtotal más IVA menos retención es igual al total en cada caso.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Seleccionar un recorrido con IVA 16% y revisar el cuadro de impuestos.","esperado":"El IVA es el 16% del subtotal."},{"donde":"Misma pantalla","accion":"Repetir con IVA 8%, con retención 4%, con tasa 0% y con no objeto.","esperado":"Cada caso calcula bien y, en no objeto, el IVA queda en cero."}]},{"nombre":"Varios recorridos en una factura","obj":"Ver cómo se agrupan los conceptos.","datos":"Tres recorridos del mismo cliente con el mismo concepto.","aprueba":"Se anota si el concepto sale en una línea o en tres, y que el subtotal sea la suma exacta.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Marcar los tres recorridos.","esperado":"Los conceptos aparecen en la factura."},{"donde":"Misma pantalla","accion":"Comparar el subtotal con la suma de los importes de los tres recorridos.","esperado":"Coinciden al centavo."}]},{"nombre":"Recorrido en dólares","obj":"Que el importe y el tipo de cambio sean correctos.","datos":"Recorrido en dólares y un tipo de cambio capturado.","aprueba":"La factura en dólares tiene tipo de cambio y el importe es el esperado.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Seleccionar el recorrido en dólares y revisar moneda y tipo de cambio.","esperado":"La moneda es dólares y el tipo de cambio aparece."},{"donde":"Misma pantalla","accion":"Dejar el tipo de cambio en blanco o en cero e intentar guardar.","esperado":"No debe dejar guardar. Anotar el mensaje."},{"donde":"Misma pantalla","accion":"Si el parámetro de conversión al facturar está activo, facturar el recorrido en dólares dentro de una factura en pesos.","esperado":"El importe se convierte con el tipo de cambio de la pantalla."}]},{"nombre":"Editar el importe durante la facturación","obj":"Ver si se puede cambiar el importe mientras se factura.","datos":"Un recorrido pendiente y un usuario con derecho de editar viaje.","aprueba":"Se anota si el cambio queda en el recorrido y si otro usuario lo ve.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Con el recorrido seleccionado, usar el botón de editar recorrido y cambiar un importe.","esperado":"Anotar si se permite y con qué derecho."},{"donde":"Misma pantalla","accion":"Regresar y revisar el subtotal de la factura.","esperado":"El subtotal refleja el cambio. Anotar si lo hace correctamente."}]}]},{"nombre":"Alta de la factura","desc":"Crear la factura y revisar sus datos","caminos":[{"nombre":"Factura de un recorrido","obj":"Camino completo con un solo recorrido.","datos":"Recorrido terminado en pesos, cliente A.","aprueba":"La factura queda guardada con folio y el recorrido sale de pendientes.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir cliente, marcar el recorrido, revisar tipo de documento, serie y folio, forma y método de pago y uso CFDI.","esperado":"Todos los datos fiscales aparecen completos."},{"donde":"Misma pantalla","accion":"Presionar Aceptar.","esperado":"La factura se guarda con folio y ofrece timbrar, generar póliza e imprimir."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Abrir el recorrido facturado.","esperado":"Ya no aparece como pendiente y muestra el número de factura."}]},{"nombre":"Crédito del cliente","obj":"Ver el aviso y el bloqueo por crédito.","datos":"Cliente con crédito agotado.","aprueba":"Se anota cuándo solo avisa y cuándo bloquea.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir el cliente con crédito agotado y marcar recorridos.","esperado":"Aparece un aviso de crédito."},{"donde":"Misma pantalla","accion":"Presionar Aceptar.","esperado":"Según el parámetro, deja guardar o bloquea. Anotar el comportamiento."}]},{"nombre":"Segundo cliente en la misma factura","obj":"Ver la opción de incluir recorridos de otro cliente.","datos":"Recorridos de cliente A y de cliente B.","aprueba":"Se confirma con el área si esta opción se usa y cómo se reportan esas facturas.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Activar incluir recorridos de otro cliente y elegir uno de cada cliente.","esperado":"Ambos recorridos quedan en la factura."},{"donde":"ERP → Reportes de Transporte de Personal","accion":"Consultar el reporte de control de recorridos por cliente.","esperado":"Anotar a qué cliente se le atribuye cada recorrido."}]},{"nombre":"Addenda","obj":"Que los campos adicionales se capturen y se guarden.","datos":"Cliente con addenda configurada.","aprueba":"La factura guarda los campos adicionales.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Elegir el cliente con addenda y capturar los campos adicionales.","esperado":"Los campos aparecen y se pueden capturar."},{"donde":"Misma pantalla","accion":"Guardar y volver a abrir la factura en consulta.","esperado":"Los campos conservan lo capturado."}]},{"nombre":"Modificar una factura guardada","obj":"Confirmar qué se puede y qué no se puede modificar.","datos":"Factura sin timbrar y factura timbrada.","aprueba":"No se puede cambiar el conjunto de recorridos de una factura.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Abrir la factura sin timbrar en modificación.","esperado":"Se pueden editar datos de la factura, pero no agregar ni quitar recorridos."},{"donde":"Misma pantalla","accion":"Intentar modificar la factura ya timbrada o con abonos.","esperado":"No debe permitirlo."}]}]},{"nombre":"Timbrado, cancelación y refacturación","desc":"El ciclo completo de una factura de recorridos","caminos":[{"nombre":"Timbrar","obj":"Confirmar el timbrado de pruebas.","datos":"Factura guardada de un recorrido.","aprueba":"La factura queda con UUID de pruebas.","antes":["Factura de un recorrido"],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Seleccionar la factura y presionar Timbrar.","esperado":"La factura queda timbrada con UUID."},{"donde":"Misma pantalla","accion":"Intentar timbrar otra vez la misma factura.","esperado":"No debe permitirlo."}]},{"nombre":"Cancelar con cada motivo","obj":"Revisar los 4 motivos del SAT.","datos":"Cuatro facturas de prueba, una por motivo.","aprueba":"Cada cancelación valida lo que debe y el recorrido vuelve a pendiente.","antes":["Timbrar"],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Cancelar con motivo 02 y fecha igual a la de la factura.","esperado":"La factura queda cancelada y el recorrido vuelve a pendientes."},{"donde":"Misma pantalla","accion":"Intentar cancelar con una fecha menor a la de la factura.","esperado":"No debe permitirlo."},{"donde":"Misma pantalla","accion":"Cancelar con motivo 01, que pide factura relacionada.","esperado":"Pide la factura de sustitución."},{"donde":"Misma pantalla","accion":"Probar los motivos 03 y 04.","esperado":"Cada uno se guarda y se anota el estatus ante el SAT."}]},{"nombre":"Cancelar con abonos o pagada","obj":"Que no se cancele una factura con cobro.","datos":"Factura con un abono o pagada.","aprueba":"No deja cancelar.","antes":[],"pasos":[{"donde":"ERP → Cobranza","accion":"Registrar un abono a una factura de recorridos.","esperado":"El abono queda registrado."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Intentar cancelar esa factura.","esperado":"No debe permitirlo."}]},{"nombre":"Refacturar un recorrido","obj":"Que un recorrido cancelado se pueda facturar de nuevo.","datos":"Recorrido con factura cancelada.","aprueba":"El recorrido vuelve a la lista y se factura sin problema.","antes":["Cancelar con cada motivo"],"pasos":[{"donde":"ERP → Facturación → Por Recorrido → Agregar","accion":"Buscar el recorrido de la factura cancelada.","esperado":"Aparece otra vez como pendiente."},{"donde":"Misma pantalla","accion":"Facturarlo de nuevo.","esperado":"Se crea la segunda factura."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Revisar la marca de refacturado del recorrido.","esperado":"Anotar si la refactura se distingue de la primera."}]},{"nombre":"Descancelar","obj":"El caso más delicado: reactivar una factura cancelada.","datos":"Factura cancelada en el sistema sin acuse del SAT y su recorrido ya refacturado.","aprueba":"Se anota qué hace el sistema. No debería haber dos facturas vigentes del mismo recorrido.","antes":["Refacturar un recorrido"],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Descancelar la factura cancelada cuyo recorrido todavía está pendiente.","esperado":"La factura vuelve a estar vigente y el recorrido sale de pendientes."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Descancelar una factura cuyo recorrido ya está en otra factura vigente.","esperado":"No debería permitirlo. Si lo permite, anotarlo como hallazgo."},{"donde":"Base de datos, solo lectura","accion":"SELECT TOP 50 IdRecorrido, COUNT(*) FROM ProRecorridosFacturas WHERE CanceladoEl IS NULL GROUP BY IdRecorrido HAVING COUNT(*) > 1","esperado":"No debe regresar filas."}]},{"nombre":"Eliminar y sustituir","obj":"Revisar los otros dos caminos de una factura cancelada.","datos":"Factura cancelada sin timbrar y factura cancelada con sustituta.","aprueba":"Eliminar solo funciona en canceladas sin timbrar y la sustitución queda enlazada.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Eliminar una factura cancelada sin timbrar.","esperado":"Se elimina y el recorrido sigue pendiente."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Intentar eliminar una factura timbrada.","esperado":"No debe permitirlo."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Sustituir una factura cancelada con motivo 01.","esperado":"La nueva factura queda ligada a la anterior."}]}]},{"nombre":"Cambios al recorrido ya facturado","desc":"Qué pasa si se toca un recorrido después de facturar o liquidar","caminos":[{"nombre":"Cancelar un recorrido facturado","obj":"Ver si el sistema lo impide.","datos":"Recorrido con factura vigente.","aprueba":"Se anota si lo bloquea y qué le pasa a la factura.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Intentar cancelar el recorrido facturado.","esperado":"Lo esperado es que lo impida. Anotar el resultado."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Si se canceló, abrir la factura.","esperado":"Anotar si la factura sigue vigente con un recorrido cancelado."}]},{"nombre":"Quitar salida o llegada tras facturar","obj":"Ver si se puede quitar lo que ya se facturó.","datos":"Recorrido terminado y facturado.","aprueba":"Se anota si lo permite y cómo queda el recorrido.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Quitar salidas o llegadas","accion":"Quitar la llegada de un recorrido ya facturado.","esperado":"Anotar si se permite."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Abrir el recorrido.","esperado":"Anotar si sigue facturado con su importe."}]},{"nombre":"Quitar llegada tras liquidar","obj":"Ver el efecto sobre la liquidación.","datos":"Parada ya liquidada.","aprueba":"Se anota si la parada pierde su lugar en la liquidación.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Quitar salidas o llegadas","accion":"Quitar la llegada de una parada ya liquidada.","esperado":"Anotar si se permite."},{"donde":"ERP → Transporte de Personal → Liquidaciones","accion":"Revisar la liquidación.","esperado":"Anotar si cambió el importe o la parada."}]},{"nombre":"Editar un recorrido facturado","obj":"Que la pantalla bloquee la edición.","datos":"Recorrido con factura vigente.","aprueba":"Los controles quedan bloqueados.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Abrir en modificación un recorrido facturado.","esperado":"Los controles de importe quedan bloqueados."},{"donde":"Misma pantalla","accion":"Intentar cambiar la marca de facturable.","esperado":"Anotar si lo permite."}]},{"nombre":"Eliminar recorridos","obj":"Evitar paradas sin recorrido.","datos":"Recorrido cancelado sin facturas y recorrido cancelado con facturas canceladas.","aprueba":"No quedan paradas huérfanas.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Eliminar un recorrido cancelado sin facturas.","esperado":"Se elimina por completo."},{"donde":"Base de datos, solo lectura","accion":"SELECT TOP 50 p.IdRecorrido FROM ProRecorridoParadas p LEFT JOIN ProRecorridos r ON r.IdRecorrido = p.IdRecorrido WHERE r.IdRecorrido IS NULL","esperado":"No debe haber paradas sin recorrido."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Intentar eliminar un recorrido con historial de facturas, aunque estén canceladas.","esperado":"No debe permitirlo."}]}]},{"nombre":"Contabilidad y cobranza","desc":"Pólizas y cargos que genera la factura","caminos":[{"nombre":"Póliza de la factura","obj":"Que cada factura genere su póliza.","datos":"Factura timbrada de un recorrido.","aprueba":"La póliza cuadra con el total de la factura.","antes":["Timbrar"],"pasos":[{"donde":"ERP → Contabilidad → Pólizas","accion":"Buscar la póliza de la factura.","esperado":"Existe y los cargos y abonos cuadran con subtotal, IVA y retención."}]},{"nombre":"Póliza de cancelación","obj":"Que la cancelación revierta la póliza.","datos":"Factura cancelada.","aprueba":"Existe la póliza de cancelación.","antes":["Cancelar con cada motivo"],"pasos":[{"donde":"ERP → Contabilidad → Pólizas","accion":"Buscar la póliza de cancelación de la factura.","esperado":"Existe y revierte la original."}]},{"nombre":"Cargo y abonos en cobranza","obj":"Que el cargo siga a la factura.","datos":"Factura vigente y factura cancelada.","aprueba":"El cargo existe en la vigente y está cancelado en la cancelada.","antes":[],"pasos":[{"donde":"ERP → Cobranza","accion":"Buscar el cargo de la factura vigente.","esperado":"Existe por el total."},{"donde":"ERP → Cobranza","accion":"Buscar el cargo de la factura cancelada.","esperado":"Aparece cancelado."}]},{"nombre":"Nota de crédito y complemento de pago","obj":"Ver cómo se relacionan con facturas de recorridos.","datos":"Factura de recorridos con nota de crédito.","aprueba":"La nota de crédito no cambia el recorrido.","antes":[],"pasos":[{"donde":"ERP → Facturación → Notas de crédito","accion":"Crear una nota de crédito sobre la factura.","esperado":"Se crea sin problema."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Revisar el recorrido.","esperado":"No cambia su estado. Anotar si el área lo espera así."}]}]},{"nombre":"Reportes y listados","desc":"Que los reportes cuenten bien lo facturado y lo pendiente","caminos":[{"nombre":"Control de recorridos por cliente","obj":"Revisar el filtro de pendientes.","datos":"Recorrido cancelado con marca de pendiente.","aprueba":"El filtro de pendientes no cuenta cancelados.","antes":[],"pasos":[{"donde":"ERP → Reportes de Transporte de Personal → Control de recorridos por cliente","accion":"Filtrar por pendientes de facturar y buscar el recorrido cancelado.","esperado":"El cancelado no debe aparecer."}]},{"nombre":"Recorridos con varias facturas","obj":"Que se muestre la factura vigente.","datos":"Recorrido con una factura cancelada y otra vigente.","aprueba":"El listado muestra la vigente.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Buscar el recorrido y revisar la columna de documento.","esperado":"Muestra la factura vigente y no la cancelada."}]},{"nombre":"Resumen de facturación y detallado","obj":"Que los totales coincidan con las facturas.","datos":"Periodo con facturas de recorridos y de viajes.","aprueba":"Los totales del reporte igualan a los del listado de facturas.","antes":[],"pasos":[{"donde":"ERP → Reportes de Tráfico → Resumen de facturación general","accion":"Generar el reporte del periodo.","esperado":"Las facturas de recorridos se cuentan una sola vez."},{"donde":"ERP → Reportes de Transporte de Personal → Detallado de recorridos","accion":"Generar el reporte del mismo periodo.","esperado":"El importe, IVA y retención coinciden con las facturas."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Sumar el listado del mismo periodo.","esperado":"El total coincide con el de los reportes."}]}]},{"nombre":"Permisos","desc":"Quién puede hacer cada acción","caminos":[{"nombre":"Derechos de facturación por recorrido","obj":"Que cada botón respete su derecho.","datos":"Un usuario con solo consultar y otro con todos los derechos del grupo Por Recorrido.","aprueba":"Cada usuario solo ve y usa lo que le corresponde.","antes":[],"pasos":[{"donde":"ERP → Facturación → Por Recorrido","accion":"Entrar con el usuario que solo consulta.","esperado":"No ve agregar, cancelar, timbrar ni eliminar."},{"donde":"ERP → Facturación → Por Recorrido","accion":"Entrar con el usuario con todos los derechos.","esperado":"Ve y puede usar todas las acciones."}]},{"nombre":"Derechos del recorrido","obj":"Que facturar, marcar no facturable y quitar salidas tengan su derecho propio.","datos":"Usuarios con y sin los derechos de facturar, no facturable y quitar salidas.","aprueba":"Cada acción responde a su propio derecho.","antes":[],"pasos":[{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Entrar sin el derecho de facturar.","esperado":"No aparece el botón Facturar."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Entrar sin el derecho de no facturable.","esperado":"La casilla Facturable no se puede cambiar."},{"donde":"ERP → Transporte de Personal → Recorridos","accion":"Entrar sin el derecho de quitar salidas y llegadas.","esperado":"No se puede quitar ninguna."}]},{"nombre":"Bitácora","obj":"Que las acciones queden registradas con su nombre correcto.","datos":"Una factura de recorridos agregada, modificada y cancelada.","aprueba":"La bitácora dice factura por recorrido y no por viaje.","antes":[],"pasos":[{"donde":"ERP → Sistema → Bitácoras","accion":"Buscar los movimientos de la factura de prueba.","esperado":"Aparecen y dicen Por Recorrido. Si dicen Por Viaje, anotarlo."}]}]}]};
const app = document.getElementById("app"), crumbEl = document.getElementById("crumb");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let r = parse();
function parse(){ try{ const h=location.hash.slice(1).split("/"); return {f:h[0]!==""&&h[0]!==undefined?+h[0]:null, c:h[1]!==undefined?+h[1]:null}; }catch(e){ return {f:null,c:null}; } }
function go(f,c){ r={f:f,c:(c===undefined?null:c)}; draw(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"+[f,c].filter(x=>x!==null&&x!==undefined).join("/")); }catch(e){} }
window.addEventListener("hashchange",()=>{ r=parse(); draw(); });
function draw(){
  const F=D.flujos;
  if(r.f===null||isNaN(r.f)||!F[r.f]){
    crumbEl.innerHTML="";
    app.innerHTML='<h1>Flujos de revisión</h1><p class="sub">Elija un flujo y después un camino. Cada camino muestra todos sus pasos.</p>'
      +'<div class="aviso"><span>⚠️</span><span><b>Solo en el ambiente de calidad.</b> Nunca en producción y sin clientes ni correos reales.</span></div>'
      +'<div class="grid">'+F.map((f,i)=>'<button class="fl" data-go="'+i+'"><span class="num">'+(i+1)+'</span><span style="flex:1"><div class="t">'+esc(f.nombre)+'</div><div class="s">'+esc(f.desc)+'</div></span><span class="chip">'+f.caminos.length+'</span></button>').join("")+'</div>';
    return;
  }
  const f=F[r.f];
  if(r.c===null||isNaN(r.c)||!f.caminos[r.c]){
    crumbEl.innerHTML='<a data-home="1">Inicio</a> › Flujo '+(r.f+1);
    app.innerHTML='<h2>Flujo '+(r.f+1)+' · '+esc(f.nombre)+'</h2><p class="sub">'+esc(f.desc)+'</p><div class="list">'
      +f.caminos.map((c,i)=>'<button class="row" data-go="'+r.f+'/'+i+'"><span class="num">'+(i+1)+'</span><span class="t">'+esc(c.nombre)+'</span><span class="chip">'+c.pasos.length+' pasos</span><span class="arrow">›</span></button>').join("")+'</div>';
    return;
  }
  const c=f.caminos[r.c];
  crumbEl.innerHTML='<a data-home="1">Inicio</a> › <a data-go="'+r.f+'">Flujo '+(r.f+1)+'</a> › Camino '+(r.c+1);
  const paso=(s,i)=>{ const sql=/SELECT|FROM /.test(s.accion);
    return '<div class="st"><div class="n">'+(i+1)+'</div><div class="donde"><span class="mlbl">Entra a</span>'+esc(s.donde)+'</div><div class="accion"><span class="mlbl">Qué hacer</span>'+(sql?'<div class="sql">'+esc(s.accion)+'</div>':esc(s.accion))+'</div><div><span class="mlbl">Qué debe pasar</span><div class="pasa">'+esc(s.esperado)+'</div></div></div>'; };
  app.innerHTML='<h2>Camino '+(r.c+1)+' · '+esc(c.nombre)+'</h2><p class="sub">Flujo '+(r.f+1)+' · '+esc(f.nombre)+' · '+c.pasos.length+' pasos</p>'
    +'<div class="info"><div><p class="lbl">Qué se revisa</p><p>'+esc(c.obj)+'</p></div><div><p class="lbl">Datos a usar</p><p>'+esc(c.datos||"—")+'</p></div><div><p class="lbl">Antes conviene haber hecho</p><p>'+(c.antes.length?c.antes.map(esc).join(", "):"Nada previo")+'</p></div></div>'
    +'<div class="steps"><div class="sh"><div>#</div><div>Entra a</div><div>Qué hacer</div><div>Qué debe pasar</div></div>'+c.pasos.map(paso).join("")+'</div>'
    +'<div class="ok"><span class="lbl">Correcto cuando</span><span>'+esc(c.aprueba)+'</span></div>';
}
document.addEventListener("click",e=>{ const t=e.target.closest("[data-go],[data-home]"); if(!t) return; if(t.dataset.home){ r={f:null,c:null}; draw(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"); }catch(e){} return; } const a=t.dataset.go.split("/").map(Number); go(a[0],a[1]); });
draw();
</script>
