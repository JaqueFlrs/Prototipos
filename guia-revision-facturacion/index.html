<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de revisión de Facturación</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--txt:#2b3a38;--mut:#6f7d7a;--line:#e6e2d8;--soft:#faf8f3;
  --brand:#2f8f83;--brand-2:#5bb5a2;--brand-soft:#e3f2ee;--ok:#2f7d62;--ok-soft:#e8f4ee;--warn:#a8742a;--warn-soft:#fbf1dd;--sql:#24332f;--sql-t:#d6e6e1;
  --shadow:0 1px 2px rgba(60,70,60,.06),0 6px 18px rgba(60,70,60,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141c1b;--card:#1c2625;--txt:#e6efec;--mut:#9bada8;--line:#2b3836;--soft:#212d2b;
  --brand:#6fd0c0;--brand-2:#8fe0cf;--brand-soft:#223a37;--ok:#7fd9ae;--ok-soft:#1d3329;--warn:#e8bd6f;--warn-soft:#352c18;--sql:#0f1716;--sql-t:#d6e6e1;
  --shadow:none}}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:clamp(14px,1.6vw,15.5px)/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-wrap:anywhere}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.ttl{font-weight:700;font-size:15px}
.crumb{color:var(--mut);font-size:13px;margin-left:auto}
.crumb a{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
main{max-width:1080px;margin:0 auto;padding:24px 16px 72px}
h1{font-size:clamp(21px,4.5vw,27px);margin:0 0 6px;letter-spacing:-.01em;line-height:1.2}
h2{font-size:clamp(19px,4vw,23px);margin:0 0 6px;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--mut);margin:0 0 18px}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--txt);border-radius:14px;padding:11px 15px;margin:0 0 20px;font-size:13.5px}
.aviso b{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.fl{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit;transition:transform .12s,border-color .12s}
.fl:hover{transform:translateY(-2px);border-color:var(--brand)}
.num{flex:0 0 38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.fl .t{font-weight:650;line-height:1.3}.fl .s{font-size:12.5px;color:var(--mut);line-height:1.4;margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;color:inherit;font:inherit}
.row:hover{border-color:var(--brand)}
.row .num{flex:0 0 32px;height:32px;border-radius:10px;font-size:13px}
.row .t{flex:1;font-weight:600}
.arrow{color:var(--mut);font-size:18px}
.info{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:14px 0}
.info>div{padding:13px 16px;border-right:1px solid var(--line)}
.info>div:last-child{border-right:0}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:0 0 3px}
.info p{margin:0;font-size:13.5px}
.steps{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sh,.st{display:grid;grid-template-columns:40px 1fr 2fr 1.7fr;gap:16px;padding:13px 16px;align-items:start}
.sh{background:var(--soft);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.st{border-bottom:1px solid var(--line)}.st:last-child{border-bottom:0}
.st .n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px}
.st .donde{color:var(--mut);font-size:13px}
.st .accion{font-weight:560}
.st .pasa{background:var(--ok-soft);border-radius:10px;padding:8px 12px;font-size:13.5px}
.mlbl{display:none}
.sql{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sql);color:var(--sql-t);border-radius:10px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;font-weight:400;overflow-x:auto}
.ok{display:flex;gap:10px;align-items:center;background:var(--ok-soft);border-radius:14px;padding:12px 16px;margin-top:14px}
.ok .lbl{margin:0;color:var(--ok);white-space:nowrap}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (max-width:860px){
  .info{grid-template-columns:1fr}.info>div{border-right:0;border-bottom:1px solid var(--line)}.info>div:last-child{border-bottom:0}
  .sh{display:none}
  .st{grid-template-columns:32px 1fr;gap:8px 12px;padding:14px}
  .st>div:not(.n){grid-column:2}
  .mlbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
  .crumb{margin-left:0;width:100%}
  .ok{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (max-width:480px){
  main{padding:18px 12px 56px}
  .top .in{padding:10px 12px}
  .row .chip{display:none}
}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo">F</div><div class="ttl">Guía de revisión · Facturación</div><div class="crumb" id="crumb"></div></div></header>
<main id="app"></main>
<script>
"use strict";
const D = {"generado":"2026-10-16","flujos":[{"nombre":"Antes de empezar","desc":"Confirmar el ambiente y dejar listos los datos de prueba","caminos":[{"nombre":"Confirmar que el ambiente es de calidad y no productivo","obj":"Evitar timbres, facturas o pólizas reales.","datos":"Nombre del servidor y base de datos que usa el ERP bajo prueba.","aprueba":"Responsable técnico confirma por escrito que es ambiente de calidad.","antes":[],"pasos":[{"donde":"Ambiente / administrador de BD","accion":"Preguntar al responsable técnico el servidor y la base de datos que usa el ERP que va a probar y anotarlos.","esperado":"Se identifica servidor y base de datos. El responsable confirma que son de calidad."},{"donde":"ERP → Facturación → Catálogos → Parámetros de Configuración (300002)","accion":"Abrir la pantalla de parámetros SIN modificar nada y consultar el timbrado de pruebas.","esperado":"Se confirma con el responsable que el timbrado apunta a pruebas (parámetro TimbrarPruebas). Si no se puede confirmar: STOP."},{"donde":"Registro del plan","accion":"Marcar el ambiente como 'No productivo' y escribir quién lo confirmó.","esperado":"Queda registrado el responsable."}]},{"nombre":"Respaldar y registrar los parámetros de Facturación","obj":"Conocer el valor original de cada parámetro para poder restaurarlo después de la Fase D.","datos":"Pantalla 300002 y tabla SisParametrosValores (Parametro, Valor).","aprueba":"Todos los parámetros de la matriz tienen valor original registrado.","antes":[],"pasos":[{"donde":"ERP → Facturación → Catálogos → Parámetros de Configuración de Facturación","accion":"Abrir la pantalla y capturar pantalla completa (desplazar para ver todos los parámetros).","esperado":"Se ven ~35 opciones con su valor actual."},{"donde":"Base de datos (solo lectura)","accion":"Ejecutar: SELECT TOP 200 Parametro, Valor FROM SisParametrosValores ORDER BY Parametro","esperado":"Se obtiene la lista de parámetros y valores. Nota: en la BD PQN_Produccion esta tabla estaba vacía; si ocurre aquí, anotarlo."},{"donde":"Registro del plan","accion":"Llenar la tabla de la hoja 'Matriz de configuración' con el valor original de cada parámetro y marcar los que no existen en BD.","esperado":"Cada fila de la matriz tiene valor original o 'No existe'."}]},{"nombre":"Preparar datos maestros de prueba","obj":"Tener clientes, conceptos, impuestos, certificado y viajes de prueba confiables.","datos":"CLI-A, CLI-B, conceptos 1 y 2, impuestos 3 y 5, un certificado CSD de pruebas vigente.","aprueba":"Todos los datos listados existen.","antes":[],"pasos":[{"donde":"ERP → Catálogos → Clientes","accion":"Localizar o crear (con autorización) CLI-A: activo, RFC de prueba, método de pago y uso CFDI definidos, con contacto de correo de prueba.","esperado":"El cliente existe y sus datos fiscales están completos."},{"donde":"ERP → Catálogos → Clientes","accion":"Localizar o crear CLI-B con límite de crédito casi agotado (para FAC-TC-041).","esperado":"Cliente listo."},{"donde":"ERP → Catálogos → Conceptos de Facturación e Impuestos","accion":"Confirmar que existen concepto 1 FLETE (traslada y retiene) y 2 MANIOBRAS, y los impuestos IVA 16% (3), RETENCION IVA 4% (5), IVA 0% (1), EXENTO (7), NO OBJETO (8).","esperado":"Todos existen con esos porcentajes. Referencia: así aparecen en CatImpuestos/CatConceptosFacturacion de la plantilla."},{"donde":"ERP → Catálogos → Certificados","accion":"Confirmar un certificado de pruebas con vigencia posterior a hoy.","esperado":"Vigencia mayor a la fecha de hoy."},{"donde":"ERP → Tráfico","accion":"Identificar al menos 3 viajes facturables del mismo cliente (uno con moneda USD si existe) y 1 viaje de un cliente distinto; anotar sus números e importes.","esperado":"Viajes anotados con importe origen."}]},{"nombre":"Verificar folios disponibles y serie por tipo de documento","obj":"Asegurar que hay folios para todas las altas del plan.","datos":"Tipo 2 FACTURA CFDI, 5 INVOICE, 10 NOTA DE CRÉDITO CFDI.","aprueba":"Hay folios suficientes por tipo y serie.","antes":[],"pasos":[{"donde":"Base de datos (solo lectura)","accion":"Ejecutar: SELECT TOP 20 IdTipoDocumento, Serie, COUNT(*) AS Disponibles FROM CatFolios WHERE Estatus=1 GROUP BY IdTipoDocumento, Serie ORDER BY IdTipoDocumento","esperado":"Hay al menos 40 folios disponibles en el tipo 2 (FACTURA CFDI), 5 en tipo 10 (NOTA DE CRÉDITO CFDI) y 5 en tipo 5 (INVOICE)."},{"donde":"ERP → Facturación → General → Agregar","accion":"Abrir el alta y revisar la lista 'Tipo de documento'.","esperado":"El tipo de documento esperado aparece con folio disponible."},{"donde":"Registro del plan","accion":"Anotar el siguiente folio disponible por tipo/serie (se usará en FAC-TC-073).","esperado":"Folio inicial anotado."}]},{"nombre":"Línea base de conteos y saldos","obj":"Fotografiar el estado antes de probar para detectar efectos inesperados.","datos":"Conteos de ProFacturas por Estatus, ProNotasCredito, ProViajesFacturas, ProPolizas.","aprueba":"Conteos anotados.","antes":[],"pasos":[{"donde":"Base de datos (solo lectura)","accion":"Ejecutar: SELECT TOP 5 Estatus, COUNT(*) FROM ProFacturas GROUP BY Estatus","esperado":"Conteos por Estatus 0/1/2."},{"donde":"Base de datos (solo lectura)","accion":"Ejecutar: SELECT COUNT(*) FROM ProNotasCredito; SELECT COUNT(*) FROM ProViajesFacturas WHERE CanceladoEl IS NULL; SELECT MAX(IdFactura) FROM ProFacturas","esperado":"Conteos anotados."}]}]},{"nombre":"Crear una factura","desc":"La forma principal de crear una factura y sus variantes comunes","caminos":[{"nombre":"Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas","obj":"Verificar el flujo principal de punta a punta.","datos":"CLI-A; concepto 1 FLETE, cantidad 1, precio 1,000.00; IVA16 y RET4; moneda PESOS; crédito.","aprueba":"Estatus 0, total 1,120.00, UUID presente, un solo registro, folio correcto, mismo total en pantalla y BD.","antes":["Confirmar que el ambiente es de calidad y no productivo","Preparar datos maestros de prueba","Verificar folios disponibles y serie por tipo de documento"],"pasos":[{"donde":"ERP → Facturación → General (300700)","accion":"Abrir el listado y entrar con un usuario con derecho de Agregar.","esperado":"El listado carga sin error y el botón Agregar está disponible."},{"donde":"Listado → Agregar","accion":"Presionar Agregar. Seleccionar tipo de documento FACTURA CFDI y verificar serie y folio asignados.","esperado":"Folio asignado = siguiente disponible anotado en FAC-TC-004."},{"donde":"Pantalla de alta general","accion":"Capturar cliente CLI-A, moneda PESOS, condiciones de pago Crédito y agregar el concepto FLETE: cantidad 1, precio 1,000.00. Dejar traslado IVA 16% y retención IVA 4%.","esperado":"Se calcula Subtotal 1,000.00; IVA 160.00; Retención 40.00; Total 1,120.00 (cálculo derivado de los porcentajes del catálogo; ver FAC-TC-030)."},{"donde":"Pantalla de alta general","accion":"Presionar Aceptar. Si el sistema pregunta por timbrar, aceptar (el ambiente debe estar en timbrado de pruebas).","esperado":"La factura se guarda con folio; el sistema informa el resultado del timbrado. Registrar el texto exacto de cada mensaje."},{"donde":"Listado de Facturas Generales","accion":"Buscar la factura por fecha y abrir Consultar.","esperado":"Aparece con cliente, serie-folio, total 1,120.00, estatus Pendiente de pago."},{"donde":"Base de datos (solo lectura)","accion":"Ejecutar: SELECT IdFactura,IdFolio,Estatus,TipoFactura,SubTotal,ImpuestosTrasladadosFederales,ImpuestosRetenidosFederales,Total,Abonos,FolioFiscalUUID,TimbrePruebas FROM ProFacturas WHERE IdFolio=@idFolio","esperado":"Estatus=0, TipoFactura=7, Total=1120.00, Abonos=0, FolioFiscalUUID con valor y TimbrePruebas verdadero."}]},{"nombre":"Alta de factura por concepto con varios conceptos","obj":"Verificar modalidad Por Concepto y su distribución.","datos":"CLI-A; FLETE 1,000.00 + MANIOBRAS 500.00; IVA16 en ambos; RET4 solo en FLETE.","aprueba":"Totales y tipo correctos.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"Facturación → Por Concepto → Agregar","accion":"Capturar cliente CLI-A y los dos conceptos con los importes indicados.","esperado":"Subtotal 1,500.00; IVA 240.00; Retención 40.00; Total 1,700.00."},{"donde":"Pantalla de alta","accion":"Aceptar.","esperado":"Factura guardada con folio."},{"donde":"Base de datos","accion":"SELECT TipoFactura,SubTotal,Total FROM ProFacturas WHERE IdFolio=@id; SELECT COUNT(*) FROM ProFacturasConceptosFacturacion WHERE IdFactura=@idFactura","esperado":"TipoFactura=1; Total=1700.00; 2 conceptos."}]},{"nombre":"Alta de factura por viaje (un viaje)","obj":"Verificar que el viaje queda ligado y bloqueado.","datos":"CLI-A; 1 viaje facturable anotado en FAC-TC-003.","aprueba":"Una fila vigente por viaje; edición bloqueada.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas","Preparar datos maestros de prueba"],"pasos":[{"donde":"Facturación → Por Viaje → Agregar","accion":"Seleccionar CLI-A y marcar el viaje de prueba en la tabla de viajes.","esperado":"Se agregan los conceptos del viaje y se calcula el total."},{"donde":"Pantalla de alta","accion":"Comparar el importe de la factura contra el importe del viaje en Tráfico.","esperado":"Coinciden (si hay conversión de moneda o agrupación, documentar la regla)."},{"donde":"Pantalla de alta","accion":"Aceptar.","esperado":"Factura guardada."},{"donde":"Base de datos","accion":"SELECT IdViaje,IdFactura,ImporteFacturado,CanceladoEl FROM ProViajesFacturas WHERE IdFactura=@idFactura","esperado":"Una fila por viaje, CanceladoEl vacío, ImporteFacturado = importe del viaje."},{"donde":"ERP → Tráfico → Viajes","accion":"Intentar modificar el importe, cliente o ruta del viaje facturado.","esperado":"El sistema impide el cambio ('No puede modificarse el viaje porque está facturado' según trigger de BD)."}]},{"nombre":"Alta por viaje con varios viajes del mismo cliente","obj":"Verificar suma y ligas múltiples.","datos":"CLI-A; 3 viajes.","aprueba":"Suma exacta y 3 ligas.","antes":["Alta de factura por viaje (un viaje)"],"pasos":[{"donde":"Facturación → Por Viaje → Agregar","accion":"Marcar los 3 viajes (o 'Marcar todos' si solo hay 3).","esperado":"Totales = suma de los viajes."},{"donde":"Pantalla de alta","accion":"Aceptar y consultar ProViajesFacturas.","esperado":"Tres filas vigentes con la misma IdFactura."}]},{"nombre":"Factura de anticipo y aplicación de anticipo con CFDI relacionado (tipo 07)","obj":"Verificar la relación entre anticipo y factura final.","datos":"CLI-A; conceptos 11 ANTICIPO DEL BIEN O SERVICIO y 10 APLICACIÓN DE ANTICIPO.","aprueba":"Relación correcta y saldo del anticipo coherente.","antes":["Alta de factura por concepto con varios conceptos"],"pasos":[{"donde":"Facturación → Por Concepto → Agregar","accion":"Crear factura de anticipo con concepto 11, importe 500.00, y timbrarla.","esperado":"Factura TipoFactura=9 timbrada, pendiente de relacionar."},{"donde":"Facturación → Por Concepto → Agregar","accion":"Crear factura final con el concepto de servicio por 1,000.00 y relacionar el anticipo (botón agregar CFDI relacionado).","esperado":"El anticipo aparece en la lista de CFDI relacionados y el saldo del anticipo se muestra."},{"donde":"Base de datos","accion":"SELECT IdFactura,IdFacturaRelacionada,Importe FROM ProFacturasRelacion WHERE IdFactura=@idFinal","esperado":"Fila con Importe = monto aplicado."}]},{"nombre":"Factura global a RFC genérico con periodicidad","obj":"Verificar la factura a público en general.","datos":"Cliente de prueba con RFC genérico XAXX010101000 (si no existe, crearlo con autorización).","aprueba":"Pide periodicidad y el XML la incluye.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"Facturación → General → Agregar","accion":"Seleccionar el cliente con RFC genérico y revisar los campos que aparecen.","esperado":"Aparece el combo de periodicidad SAT (COMBO_Periodicidad)."},{"donde":"Alta general","accion":"Intentar guardar sin elegir periodicidad.","esperado":"Registrar el comportamiento exacto: la regla indica que se solicita periodicidad; el mensaje esperado queda PENDIENTE."},{"donde":"Alta general","accion":"Elegir periodicidad y guardar.","esperado":"La factura se guarda y se timbra de pruebas; el XML incluye la información global."}]},{"nombre":"Alta con addenda del cliente","obj":"Verificar captura, validación y estatus de envío de la addenda.","datos":"Cliente con addenda configurada y sus campos requeridos.","aprueba":"Campos requeridos exigidos y guardados.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"Alta general","accion":"Seleccionar el cliente con addenda y elegir la addenda en el combo.","esperado":"Aparecen los campos adicionales de la addenda."},{"donde":"Alta general","accion":"Dejar vacío un campo requerido y guardar.","esperado":"Se rechaza por campo requerido de la addenda. Registrar mensaje."},{"donde":"Alta general","accion":"Completar los campos y guardar.","esperado":"La factura se guarda con la addenda en el XML."},{"donde":"Base de datos","accion":"SELECT IdAddenda,EstatusEnvios,ResultadosEnvios FROM ProFacturasAddendasCamposAdicionales WHERE IdFactura=@id","esperado":"Una fila con los valores capturados."}]}]},{"nombre":"Otras formas de facturar","desc":"Viaje parcial, peso, kilómetro, recorrido, combustible, Pemex, prefactura y copiado","caminos":[{"nombre":"Alta de factura por viaje parcial","obj":"Verificar la modalidad 'viaje parcial'.","datos":"CLI-A y un documento origen de tipo 'viaje parcial' (viaje/recorrido/relación) preparado por Tráfico.","aprueba":"TipoFactura=3; total coincide; liga al origen correcta.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"ERP → Facturación → Por Viaje Parcial (300300)","accion":"Abrir el listado y presionar Agregar.","esperado":"Se abre la pantalla de alta de la modalidad."},{"donde":"Pantalla de alta","accion":"Seleccionar CLI-A y el documento origen; revisar el importe propuesto.","esperado":"Se factura solo una parte de los conceptos del viaje; el resto queda pendiente (ProViajesConceptosFacturacionFacturadosParcialmente). Registrar cómo se calculó el importe con los datos usados."},{"donde":"Pantalla de alta","accion":"Aceptar y consultar en BD: SELECT TipoFactura,SubTotal,Total FROM ProFacturas WHERE IdFolio=@id","esperado":"TipoFactura=3 y total igual al de pantalla."}]},{"nombre":"Alta de factura por peso de descarga","obj":"Verificar la modalidad 'peso de descarga'.","datos":"CLI-A y un documento origen de tipo 'peso de descarga' (viaje/recorrido/relación) preparado por Tráfico.","aprueba":"TipoFactura=4; total coincide; liga al origen correcta.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"ERP → Facturación → Por Peso Descarga (300400)","accion":"Abrir el listado y presionar Agregar.","esperado":"Se abre la pantalla de alta de la modalidad."},{"donde":"Pantalla de alta","accion":"Seleccionar CLI-A y el documento origen; revisar el importe propuesto.","esperado":"El importe se calcula con el peso de descarga capturado. Registrar cómo se calculó el importe con los datos usados."},{"donde":"Pantalla de alta","accion":"Aceptar y consultar en BD: SELECT TipoFactura,SubTotal,Total FROM ProFacturas WHERE IdFolio=@id","esperado":"TipoFactura=4 y total igual al de pantalla."}]},{"nombre":"Alta de factura por kilómetro","obj":"Verificar la modalidad 'kilómetro'.","datos":"CLI-A y un documento origen de tipo 'kilómetro' (viaje/recorrido/relación) preparado por Tráfico.","aprueba":"TipoFactura=5; total coincide; liga al origen correcta.","antes":["Alta de factura general, 1 concepto, MXN, crédito, timbrado de pruebas"],"pasos":[{"donde":"ERP → Facturación → Por Kilómetro (300500)","accion":"Abrir el listado y presionar Agregar.","esperado":"Se abre la pantalla de al rado":"Anotar segundos (umbral por definir con Negocio)."},{"donde":"Alta general","accion":"Crear una factura con 50 conceptos.","esperado":"Anotar segundos de guardado y timbrado."},{"donde":"Cierre","accion":"Comparar con el tiempo en el sistema anterior si existe.","esperado":"Diferencia registrada."}]},{"nombre":"Cierre: cobertura, incidencias y veredicto de la regresión","obj":"Dictamen final con evidencia.","datos":"Plan exportado.","aprueba":"Todos los P0 aprobados y fallos con incidencia.","antes":["Facturas históricas migradas: consulta, impresión y XML","Integridad de datos históricos (consultas de solo lectura)"],"pasos":[{"donde":"Plan → Reporte","accion":"Revisar el reporte: casos por estado, bloqueados y fallidos.","esperado":"Ningún P0 pendiente o bloqueado sin decisión."},{"donde":"Plan → Incidencias","accion":"Revisar que cada caso fallido tiene número de incidencia.","esperado":"Todos con incidencia."},{"donde":"Registro","accion":"Anotar el veredicto: Aprobado / Aprobado con riesgos / No aprobado.","esperado":"Veredicto firmado por el responsable."}]}]}]};
const app = document.getElementById("app"), crumbEl = document.getElementById("crumb");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let r = parse();
function parse(){ try{ const h=location.hash.slice(1).split("/"); return {f:h[0]!==""&&h[0]!==undefined?+h[0]:null, c:h[1]!==undefined?+h[1]:null}; }catch(e){ return {f:null,c:null}; } }
function go(f,c){ r={f:f,c:(c===undefined?null:c)}; draw(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"+[f,c].filter(x=>x!==null&&x!==undefined).join("/")); }catch(e){} }
window.addEventListener("hashchange",()=>{ r=parse(); draw(); });
function draw(){
  const F=D.flujos;
  if(r.f===null||isNaN(r.f)||!F[r.f]){
    crumbEl.innerHTML="";
    app.innerHTML='<h1>Flujos de revisión</h1><p class="sub">Elija un flujo y después un camino. Cada camino muestra todos sus pasos.</p>'
      +'<div class="aviso"><span>⚠️</span><span><b>Solo en el ambiente de calidad.</b> Nunca en producción y sin clientes ni correos reales.</span></div>'
      +'<div class="grid">'+F.map((f,i)=>'<button class="fl" data-go="'+i+'"><span class="num">'+(i+1)+'</span><span style="flex:1"><div class="t">'+esc(f.nombre)+'</div><div class="s">'+esc(f.desc)+'</div></span><span class="chip">'+f.caminos.length+'</span></button>').join("")+'</div>';
    return;
  }
  const f=F[r.f];
  if(r.c===null||isNaN(r.c)||!f.caminos[r.c]){
    crumbEl.innerHTML='<a data-home="1">Inicio</a> › Flujo '+(r.f+1);
    app.innerHTML='<h2>Flujo '+(r.f+1)+' · '+esc(f.nombre)+'</h2><p class="sub">'+esc(f.desc)+'</p><div class="list">'
      +f.caminos.map((c,i)=>'<button class="row" data-go="'+r.f+'/'+i+'"><span class="num">'+(i+1)+'</span><span class="t">'+esc(c.nombre)+'</span><span class="chip">'+c.pasos.length+' pasos</span><span class="arrow">›</span></button>').join("")+'</div>';
    return;
  }
  const c=f.caminos[r.c];
  crumbEl.innerHTML='<a data-home="1">Inicio</a> › <a data-go="'+r.f+'">Flujo '+(r.f+1)+'</a> › Camino '+(r.c+1);
  const paso=(s,i)=>{ const sql=/SELECT|FROM /.test(s.accion);
    return '<div class="st"><div class="n">'+(i+1)+'</div><div class="donde"><span class="mlbl">Entra a</span>'+esc(s.donde)+'</div><div class="accion"><span class="mlbl">Qué hacer</span>'+(sql?'<div class="sql">'+esc(s.accion)+'</div>':esc(s.accion))+'</div><div><span class="mlbl">Qué debe pasar</span><div class="pasa">'+esc(s.esperado)+'</div></div></div>'; };
  app.innerHTML='<h2>Camino '+(r.c+1)+' · '+esc(c.nombre)+'</h2><p class="sub">Flujo '+(r.f+1)+' · '+esc(f.nombre)+' · '+c.pasos.length+' pasos</p>'
    +'<div class="info"><div><p class="lbl">Qué se revisa</p><p>'+esc(c.obj)+'</p></div><div><p class="lbl">Datos a usar</p><p>'+esc(c.datos||"—")+'</p></div><div><p class="lbl">Antes conviene haber hecho</p><p>'+(c.antes.length?c.antes.map(esc).join(", "):"Nada previo")+'</p></div></div>'
    +'<div class="steps"><div class="sh"><div>#</div><div>Entra a</div><div>Qué hacer</div><div>Qué debe pasar</div></div>'+c.pasos.map(paso).join("")+'</div>'
    +'<div class="ok"><span class="lbl">Correcto cuando</span><span>'+esc(c.aprueba)+'</span></div>';
}
document.addEventListener("click",e=>{ const t=e.target.closest("[data-go],[data-home]"); if(!t) return; if(t.dataset.home){ r={f:null,c:null}; draw(); window.scrollTo(0,0); try{ history.replaceState(null,"","#"); }catch(e){} return; } const a=t.dataset.go.split("/").map(Number); go(a[0],a[1]); });
draw();
</script>
