<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM Transport · Prototipos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f5f7;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 36px 24px 32px;
      text-align: center;
    }

    .header-logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-logo .brand { color: #F2940E; }
    .header-logo .sep   { color: #ffffff; opacity: 0.4; margin: 0 6px; }
    .header-logo .sub   { color: #ffffff; }

    .header-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #9ca3af;
    }

    .header-badge {
      display: inline-block;
      margin-top: 14px;
      background: #F2940E;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    /* ── SEARCH AREA ── */
    .search-area {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 0 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 48px;
      padding: 0 18px 0 48px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      color: #1f2937;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      outline: none;
      transition: box-shadow 0.2s;
    }
    #searchInput:focus { box-shadow: 0 4px 20px rgba(242,148,14,0.35); }
    #searchInput::placeholder { color: #9ca3af; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 600px;
      width: 100%;
    }

    .filter-pill {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      background: #fff;
      color: #374151;
      transition: all 0.15s;
      user-select: none;
    }
    .filter-pill:hover { border-color: #F2940E; color: #F2940E; }
    .filter-pill.active { background: #F2940E; border-color: #F2940E; color: #fff; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1160px;
      margin: 24px auto 0;
      padding: 0 24px;
      width: 100%;
    }

    #counter {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
    }

    .sort-btns { display: flex; gap: 8px; }

    .sort-btn {
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 2px solid #e5e7eb;
      background: #fff;
      color: #374151;
      transition: all 0.15s;
    }
    .sort-btn:hover { border-color: #F2940E; color: #F2940E; }
    .sort-btn.active { background: #F2940E; border-color: #F2940E; color: #fff; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1160px;
      margin: 16px auto 32px;
      padding: 0 24px;
      width: 100%;
    }

    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
    }

    .card-band {
      height: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .card-body {
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-proyecto {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
      white-space: nowrap;
    }

    .badge-ticket {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #6b7280;
      white-space: nowrap;
    }

    .card-fecha {
      font-size: 11px;
      color: #9ca3af;
      margin-left: auto;
      white-space: nowrap;
    }

    .card-nombre {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer { padding: 0 16px 16px; }

    .btn-abrir {
      display: block;
      width: 100%;
      padding: 10px;
      background: #F2940E;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .btn-abrir:hover { background: #d97e0a; }

    /* ── EMPTY STATE ── */
    .empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      grid-column: 1 / -1;
      text-align: center;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 700; color: #374151; }
    .empty-sub { font-size: 14px; color: #9ca3af; margin-top: 6px; }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #6b7280;
      text-align: center;
      font-size: 13px;
      padding: 20px 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <span class="brand">GM Transport</span>
    <span class="sep">·</span>
    <span class="sub">Prototipos</span>
  </div>
  <div class="header-subtitle">Maquetas y mockups de funcionalidades</div>
  <span class="header-badge" id="totalBadge">10 prototipos</span>
</header>

<div class="search-area">
  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar por nombre, ticket o módulo..." />
  </div>
  <div class="filters">
    <div class="filter-pill active" data-filter="Todos">Todos</div>
    <div class="filter-pill" data-filter="Mis Viajes">Mis Viajes</div>
    <div class="filter-pill" data-filter="DobleCheck">DobleCheck</div>
    <div class="filter-pill" data-filter="Hermes">Hermes</div>
    <div class="filter-pill" data-filter="CH-439">CH-439</div>
    <div class="filter-pill" data-filter="Presentaciones">Presentaciones</div>
  </div>
</div>

<div class="toolbar">
  <span id="counter">Mostrando 10 de 10</span>
  <div class="sort-btns">
    <button class="sort-btn active" id="btnReciente">↓ Más reciente</button>
    <button class="sort-btn" id="btnAntiguo">↑ Más antiguo</button>
  </div>
</div>

<div class="grid" id="grid">
  <!-- Cards rendered by JS -->
  <div class="empty" id="empty">
    <div class="empty-icon">🔎</div>
    <div class="empty-title">Sin resultados</div>
    <div class="empty-sub">Intenta con otro término o limpia los filtros</div>
  </div>
</div>

<footer>GM Transport Software® · Prototipos internos</footer>

<script>
  const PROYECTO_COLORS = {
    "Mis Viajes":     "#F2940E",
    "DobleCheck":     "#3B82F6",
    "Hermes":         "#10B981",
    "CH-439":         "#8B5CF6",
    "Presentaciones": "#6B7280",
  };
  const DEFAULT_COLOR = "#F59E0B";

  const PROTOTIPOS = [
    {
      nombre: "SOS sin GPS",
      ticket: "#35074",
      proyecto: "Mis Viajes",
      descripcion: "Notificación SOS cuando el cliente no tiene GPS — correo + campanita ERP",
      url: "mis-viajes-sos/index.html",
      fecha: "2026-06-05"
    },
    {
      nombre: "Portal Cliente + Mejoras IA",
      ticket: "",
      proyecto: "Hermes",
      descripcion: "Portal de cliente con mejoras de IA para cotizaciones ERP",
      url: "hermes-portal-cliente/index.html",
      fecha: "2026-05-01"
    },
    {
      nombre: "CH-439 Correo",
      ticket: "CH-439",
      proyecto: "CH-439",
      descripcion: "Variante de correo para CH-439",
      url: "CH-439-correo/index.html",
      fecha: "2026-04-15"
    },
    {
      nombre: "CH-439",
      ticket: "CH-439",
      proyecto: "CH-439",
      descripcion: "Prototipo principal CH-439",
      url: "CH-439/index.html",
      fecha: "2026-04-10"
    },
    {
      nombre: "Trazabilidad en Inspecciones",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Trazabilidad de inspecciones en formularios DobleCheck",
      url: "doblecheck-trazabilidad/mockup.html",
      fecha: "2026-03-20"
    },
    {
      nombre: "Notificaciones por Pregunta",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Notificaciones por pregunta y grupos en formularios",
      url: "doblecheck-notificaciones/DobleCheck - Notificaciones por Pregunta y Grupos - mockup.html",
      fecha: "2026-03-10"
    },
    {
      nombre: "C-TPAT Seguimiento",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Seguimiento y notificación de estatus en formularios DobleCheck",
      url: "doblecheck-ctpat-seguimiento/mockup.html",
      fecha: "2026-02-15"
    },
    {
      nombre: "Presentación IA GM",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Presentación ejecutiva de IA para GM Transport",
      url: "presentaciones/ia-gm/IA-GM Presentacion.html",
      fecha: "2026-01-20"
    },
    {
      nombre: "Kanban Guía Completa",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Guía completa de metodología Kanban para el equipo",
      url: "presentaciones/kanban/kanban-guia-completa.html",
      fecha: "2025-12-10"
    },
    {
      nombre: "Kanban Guía Transición",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Guía de transición a Kanban",
      url: "presentaciones/kanban/kanban-guia-transicion.html",
      fecha: "2025-12-10"
    }
  ];

  const TOTAL = PROTOTIPOS.length;

  function formatFecha(iso) {
    const [y, m] = iso.split('-');
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return meses[parseInt(m,10)-1] + ' ' + y;
  }

  function colorOf(proyecto) { return PROYECTO_COLORS[proyecto] || DEFAULT_COLOR; }

  function buildCard(p) {
    const color = colorOf(p.proyecto);
    const ticketHtml = p.ticket
      ? `<span class="badge-ticket">${p.ticket}</span>` : '';
    return `
      <div class="card" data-proyecto="${p.proyecto}" data-search="${[p.nombre, p.ticket, p.descripcion, p.proyecto].join(' ').toLowerCase()}">
        <div class="card-band" style="background:${color}"></div>
        <div class="card-body">
          <div class="card-meta">
            <span class="badge-proyecto" style="background:${color}">${p.proyecto}</span>
            ${ticketHtml}
            <span class="card-fecha">${formatFecha(p.fecha)}</span>
          </div>
          <div class="card-nombre">${p.nombre}</div>
          <div class="card-desc">${p.descripcion}</div>
        </div>
        <div class="card-footer">
          <a class="btn-abrir" href="${p.url}" target="_blank">Abrir →</a>
        </div>
      </div>`;
  }

  let sortDesc = true;
  let activeFilter = 'Todos';
  let searchTerm = '';

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const counter = document.getElementById('counter');

  function render() {
    let list = [...PROTOTIPOS];

    // Sort
    list.sort((a, b) => {
      const diff = a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
      return sortDesc ? -diff : diff;
    });

    // Filter by proyecto
    if (activeFilter !== 'Todos') {
      list = list.filter(p => p.proyecto === activeFilter);
    }

    // Filter by search
    if (searchTerm) {
      list = list.filter(p =>
        [p.nombre, p.ticket, p.descripcion, p.proyecto].join(' ').toLowerCase().includes(searchTerm)
      );
    }

    // Clear cards (keep empty div)
    const cards = grid.querySelectorAll('.card');
    cards.forEach(c => c.remove());

    if (list.length === 0) {
      empty.style.display = 'flex';
      counter.textContent = 'Mostrando 0 de ' + TOTAL;
    } else {
      empty.style.display = 'none';
      list.forEach(p => {
        grid.insertAdjacentHTML('afterbegin', buildCard(p));
      });
      // Re-order so cards appear before empty div
      const newCards = grid.querySelectorAll('.card');
      newCards.forEach(c => grid.insertBefore(c, empty));
      counter.textContent = `Mostrando ${list.length} de ${TOTAL}`;
    }
  }

  // Initial render
  render();

  // Search
  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  // Filters
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = pill.dataset.filter;
      render();
    });
  });

  // Sort
  document.getElementById('btnReciente').addEventListener('click', () => {
    sortDesc = true;
    document.getElementById('btnReciente').classList.add('active');
    document.getElementById('btnAntiguo').classList.remove('active');
    render();
  });
  document.getElementById('btnAntiguo').addEventListener('click', () => {
    sortDesc = false;
    document.getElementById('btnAntiguo').classList.add('active');
    document.getElementById('btnReciente').classList.remove('active');
    render();
  });
</script>
</body>
</html>
