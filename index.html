    .tabs { display: flex; gap: 6px; border-bottom: 2px solid #e5e5e5; margin-bottom: 8px; }
    .tab { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 16px; font: inherit; font-size: 14px; font-weight: bold; color: #777; cursor: pointer; }

    ul { list-style: none; }
    li { border-bottom: 1px solid #e5e5e5; }
    li a {

      padding: 7px 4px; text-decoration: none; color: #111;

    .ticket { font-size: 11px; color: #888; width: 70px; flex-shrink: 0; }
    .nombre { flex: 1; }
    .fecha { font-size: 11px; color: #aaa; flex-shrink: 0; }
    @media (max-width: 600px) { body { padding: 16px; } .tab { padding: 8px 10px; font-size: 13px; } .ticket { width: 54px; } }

  const TABS = ['Manuales', 'Prototipos', 'Guías'];
  const ul = document.getElementById('lista');
  const tabsEl = document.getElementById('tabs');
  let activa = TABS.find(t => t === decodeURIComponent(location.hash.slice(1))) || 'Prototipos';

  function pintar() {
    tabsEl.innerHTML = TABS.map(t => {
      const n = DATA.filter(d => d.cat === t).length;
      return '<button class="tab' + (t === activa ? ' on' : '') + '" role="tab" aria-selected="' + (t === activa) + '" data-tab="' + t + '">' + t + '<span class="n">' + n + '</span></button>';
    }).join('');
    ul.innerHTML = '';
    DATA.filter(d => d.cat === activa).forEach(d => {
      const li = document.createElement('li');
      li.innerHTML = `<a href="${d.url}">
      <span class="ticket">${d.ticket}</span>
      <span class="nombre">${d.nombre}</span>
      <span class="fecha">${d.fecha}</span>
    </a>`;
      ul.appendChild(li);
    });
  }
  tabsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    activa = b.dataset.tab;
    try { history.replaceState(null, '', '#' + encodeURIComponent(activa)); } catch (err) {}
    pintar();
  });
  pintar();
