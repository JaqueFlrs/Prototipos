<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM Transport · Prototipos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      background: #f0f0f0;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .erp-logo-icon {
      width: 32px; height: 32px;
      background: #F2940E;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #fff;
      flex-shrink: 0;
    }

    .erp-logo-text {
      font-size: 13px; font-weight: bold; color: #333; line-height: 1.2;
    }
    .erp-logo-text small {
      display: block; font-size: 10px; font-weight: normal; color: #888;
    }

    .header-sep {
      width: 1px; height: 30px; background: #ddd; flex-shrink: 0; margin: 0 6px;
    }

    .header-title {
      font-size: 14px; font-weight: bold; color: #555;
    }

    .header-badge {
      margin-left: auto;
      background: #F2940E;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 12px;
      border-radius: 2px;
    }

    /* ── PANEL TITLE ── */
    .panel-title {
      background: #F2940E;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      padding: 6px 24px;
    }

    /* ── SEARCH AREA ── */
    .search-area {
      background: #e8e8e8;
      border-bottom: 1px solid #ccc;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      min-width: 180px;
      max-width: 320px;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: #888;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 30px;
      border: 1px solid #ccc;
      border-radius: 2px;
      font-size: 12px;
      font-family: Calibri, sans-serif;
      color: #333;
      background: #fff;
      outline: none;
    }
    #searchInput:focus { border-color: #F2940E; }
    #searchInput::placeholder { color: #aaa; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .filter-pill {
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #bbb;
      background: #fff;
      color: #555;
      transition: all 0.12s;
      user-select: none;
      font-family: Calibri, sans-serif;
    }
    .filter-pill:hover { border-color: #F2940E; color: #F2940E; background: #fff9f0; }
    .filter-pill.active { background: #F2940E; border-color: #F2940E; color: #fff; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1080px;
      margin: 16px auto 0;
      padding: 0 24px;
      width: 100%;
    }

    #counter {
      font-size: 12px;
      color: #888;
    }

    .sort-btns { display: flex; gap: 5px; }

    .sort-btn {
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #bbb;
      background: #fff;
      color: #555;
      transition: all 0.12s;
      font-family: Calibri, sans-serif;
    }
    .sort-btn:hover { border-color: #F2940E; color: #F2940E; }
    .sort-btn.active { background: #F2940E; border-color: #F2940E; color: #fff; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 1080px;
      margin: 12px auto 32px;
      padding: 0 24px;
      width: 100%;
    }

    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

    /* ── CARD ── */
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-left: 5px solid #F2940E;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.15s;
    }
    .card:hover {
      box-shadow: 0 3px 12px rgba(0,0,0,0.13);
    }

    .card-body {
      padding: 12px 14px 8px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-proyecto {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 2px;
      color: #fff;
      white-space: nowrap;
    }

    .badge-ticket {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 2px;
      background: #f0f0f0;
      color: #777;
      border: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    .card-fecha {
      font-size: 11px;
      color: #aaa;
      margin-left: auto;
      white-space: nowrap;
    }

    .card-nombre {
      font-size: 15px;
      font-weight: bold;
      color: #222;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      padding: 0 14px 12px;
    }

    .btn-abrir {
      display: block;
      width: 100%;
      padding: 7px;
      background: #F2940E;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      font-family: Calibri, sans-serif;
      border-radius: 2px;
      transition: background 0.12s;
    }
    .btn-abrir:hover { background: #d97e0a; }

    /* ── EMPTY STATE ── */
    .empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      grid-column: 1 / -1;
      text-align: center;
    }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-title { font-size: 15px; font-weight: bold; color: #666; }
    .empty-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      background: #e0e0e0;
      border-top: 1px solid #ccc;
      color: #999;
      text-align: center;
      font-size: 12px;
      padding: 14px 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="erp-logo-icon">G</div>
  <div class="erp-logo-text">
    gm Transport Software&reg;
    <small>ERP</small>
  </div>
  <div class="header-sep"></div>
  <div class="header-title">Prototipos</div>
  <span class="header-badge" id="totalBadge">10 prototipos</span>
</header>

<div class="panel-title">Maquetas y mockups de funcionalidades</div>

<div class="search-area">
  <div class="search-wrapper">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="searchInput" placeholder="Buscar por nombre, ticket o m&oacute;dulo..." />
  </div>
  <div class="filters">
    <div class="filter-pill active" data-filter="Todos">Todos</div>
    <div class="filter-pill" data-filter="Mis Viajes">Mis Viajes</div>
    <div class="filter-pill" data-filter="DobleCheck">DobleCheck</div>
    <div class="filter-pill" data-filter="Hermes">Hermes</div>
    <div class="filter-pill" data-filter="CH-439">CH-439</div>
    <div class="filter-pill" data-filter="Presentaciones">Presentaciones</div>
  </div>
</div>

<div class="toolbar">
  <span id="counter">Mostrando 10 de 10</span>
  <div class="sort-btns">
    <button class="sort-btn active" id="btnReciente">&#8595; M&aacute;s reciente</button>
    <button class="sort-btn" id="btnAntiguo">&#8593; M&aacute;s antiguo</button>
  </div>
</div>

<div class="grid" id="grid">
  <div class="empty" id="empty">
    <div class="empty-icon">&#128269;</div>
    <div class="empty-title">Sin resultados</div>
    <div class="empty-sub">Intenta con otro t&eacute;rmino o limpia los filtros</div>
  </div>
</div>

<footer>GM Transport Software&reg; &nbsp;&middot;&nbsp; Prototipos internos</footer>

<script>
  const PROYECTO_COLORS = {
    "Mis Viajes":     "#F2940E",
    "DobleCheck":     "#3B82F6",
    "Hermes":         "#10B981",
    "CH-439":         "#8B5CF6",
    "Presentaciones": "#6B7280",
  };
  const DEFAULT_COLOR = "#F59E0B";

  const PROTOTIPOS = [
    {
      nombre: "SOS sin GPS",
      ticket: "#35074",
      proyecto: "Mis Viajes",
      descripcion: "Notificación SOS cuando el cliente no tiene GPS — correo + campanita ERP",
      url: "mis-viajes-sos/index.html",
      fecha: "2026-06-05"
    },
    {
      nombre: "Portal Cliente + Mejoras IA",
      ticket: "",
      proyecto: "Hermes",
      descripcion: "Portal de cliente con mejoras de IA para cotizaciones ERP",
      url: "hermes-portal-cliente/index.html",
      fecha: "2026-05-01"
    },
    {
      nombre: "CH-439 Correo",
      ticket: "CH-439",
      proyecto: "CH-439",
      descripcion: "Variante de correo para CH-439",
      url: "CH-439-correo/index.html",
      fecha: "2026-04-15"
    },
    {
      nombre: "CH-439",
      ticket: "CH-439",
      proyecto: "CH-439",
      descripcion: "Prototipo principal CH-439",
      url: "CH-439/index.html",
      fecha: "2026-04-10"
    },
    {
      nombre: "Trazabilidad en Inspecciones",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Trazabilidad de inspecciones en formularios DobleCheck",
      url: "doblecheck-trazabilidad/mockup.html",
      fecha: "2026-03-20"
    },
    {
      nombre: "Notificaciones por Pregunta",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Notificaciones por pregunta y grupos en formularios",
      url: "doblecheck-notificaciones/DobleCheck - Notificaciones por Pregunta y Grupos - mockup.html",
      fecha: "2026-03-10"
    },
    {
      nombre: "C-TPAT Seguimiento",
      ticket: "",
      proyecto: "DobleCheck",
      descripcion: "Seguimiento y notificación de estatus en formularios DobleCheck",
      url: "doblecheck-ctpat-seguimiento/mockup.html",
      fecha: "2026-02-15"
    },
    {
      nombre: "Presentación IA GM",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Presentación ejecutiva de IA para GM Transport",
      url: "presentaciones/ia-gm/IA-GM Presentacion.html",
      fecha: "2026-01-20"
    },
    {
      nombre: "Kanban Guía Completa",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Guía completa de metodología Kanban para el equipo",
      url: "presentaciones/kanban/kanban-guia-completa.html",
      fecha: "2025-12-10"
    },
    {
      nombre: "Kanban Guía Transición",
      ticket: "",
      proyecto: "Presentaciones",
      descripcion: "Guía de transición a Kanban",
      url: "presentaciones/kanban/kanban-guia-transicion.html",
      fecha: "2025-12-10"
    }
  ];

  const TOTAL = PROTOTIPOS.length;

  function formatFecha(iso) {
    const [y, m] = iso.split('-');
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return meses[parseInt(m,10)-1] + ' ' + y;
  }

  function colorOf(proyecto) { return PROYECTO_COLORS[proyecto] || DEFAULT_COLOR; }

  function buildCard(p) {
    const color = colorOf(p.proyecto);
    const ticketHtml = p.ticket
      ? `<span class="badge-ticket">${p.ticket}</span>` : '';
    return `
      <div class="card" style="border-left-color:${color}" data-proyecto="${p.proyecto}" data-search="${[p.nombre, p.ticket, p.descripcion, p.proyecto].join(' ').toLowerCase()}">
        <div class="card-body">
          <div class="card-meta">
            <span class="badge-proyecto" style="background:${color}">${p.proyecto}</span>
            ${ticketHtml}
            <span class="card-fecha">${formatFecha(p.fecha)}</span>
          </div>
          <div class="card-nombre">${p.nombre}</div>
          <div class="card-desc">${p.descripcion}</div>
        </div>
        <div class="card-footer">
          <a class="btn-abrir" href="${p.url}" target="_blank">Abrir &rarr;</a>
        </div>
      </div>`;
  }

  let sortDesc = true;
  let activeFilter = 'Todos';
  let searchTerm = '';

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const counter = document.getElementById('counter');

  function render() {
    let list = [...PROTOTIPOS];

    list.sort((a, b) => {
      const diff = a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
      return sortDesc ? -diff : diff;
    });

    if (activeFilter !== 'Todos') {
      list = list.filter(p => p.proyecto === activeFilter);
    }

    if (searchTerm) {
      list = list.filter(p =>
        [p.nombre, p.ticket, p.descripcion, p.proyecto].join(' ').toLowerCase().includes(searchTerm)
      );
    }

    const cards = grid.querySelectorAll('.card');
    cards.forEach(c => c.remove());

    if (list.length === 0) {
      empty.style.display = 'flex';
      counter.textContent = 'Mostrando 0 de ' + TOTAL;
    } else {
      empty.style.display = 'none';
      list.forEach(p => {
        grid.insertAdjacentHTML('afterbegin', buildCard(p));
      });
      const newCards = grid.querySelectorAll('.card');
      newCards.forEach(c => grid.insertBefore(c, empty));
      counter.textContent = `Mostrando ${list.length} de ${TOTAL}`;
    }
  }

  render();

  document.getElementById('searchInput').addEventListener('input', e => {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = pill.dataset.filter;
      render();
    });
  });

  document.getElementById('btnReciente').addEventListener('click', () => {
    sortDesc = true;
    document.getElementById('btnReciente').classList.add('active');
    document.getElementById('btnAntiguo').classList.remove('active');
    render();
  });
  document.getElementById('btnAntiguo').addEventListener('click', () => {
    sortDesc = false;
    document.getElementById('btnAntiguo').classList.add('active');
    document.getElementById('btnReciente').classList.remove('active');
    render();
  });

  document.getElementById('totalBadge').textContent = TOTAL + ' prototipos';
</script>
</body>
</html>
