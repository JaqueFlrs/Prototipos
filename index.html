<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM Transport · Prototipos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f9fafb;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --text-1: #111827;
      --text-2: #374151;
      --text-3: #6b7280;
      --text-4: #9ca3af;
      --brand: #F2940E;
      --brand-light: rgba(242,148,14,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 56px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-mark {
      width: 28px; height: 28px;
      background: var(--brand);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
    }

    .header-sep { color: var(--border); font-size: 20px; line-height: 1; }

    .logo-sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-3);
    }

    .header-end {
      margin-left: auto;
    }

    .count-chip {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 11px;
      border-radius: 999px;
    }

    /* ── PAGE HERO ── */
    .page-hero {
      padding: 56px 40px 0;
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
    }

    .page-hero h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--text-1);
      margin-bottom: 6px;
    }

    .page-hero p {
      font-size: 15px;
      color: var(--text-3);
      font-weight: 400;
      margin-bottom: 28px;
    }

    /* ── SEARCH + FILTERS ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 320px;
    }

    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--text-4);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: var(--text-1);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #searchInput:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }
    #searchInput::placeholder { color: var(--text-4); }

    .filter-tabs {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
    }

    .ftab {
      cursor: pointer;
      padding: 5px 13px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: none;
      background: transparent;
      color: var(--text-3);
      transition: all 0.12s;
      user-select: none;
    }
    .ftab:hover { background: var(--surface); color: var(--text-2); }
    .ftab.active { background: var(--text-1); color: #fff; }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1040px;
      margin: 20px auto 0;
      padding: 0 40px;
      width: 100%;
    }

    #counter {
      font-size: 13px;
      color: var(--text-4);
      font-weight: 400;
    }

    .sort-btns { display: flex; gap: 4px; }

    .sort-btn {
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-3);
      transition: all 0.12s;
    }
    .sort-btn:hover { background: var(--surface); color: var(--text-2); }
    .sort-btn.active {
      background: var(--surface);
      color: var(--text-1);
      border-color: var(--text-1);
      font-weight: 600;
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      max-width: 1040px;
      margin: 14px auto 64px;
      padding: 0 40px;
      width: 100%;
    }

    @media (max-width: 700px) {
      .page-hero, .toolbar, .grid { padding-left: 20px; padding-right: 20px; }
      header { padding: 0 20px; }
      .grid { grid-template-columns: 1fr; }
    }

    /* ── CARD ── */
    .card {
      background: var(--bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      box-shadow: 0 6px 28px rgba(17,24,39,0.09);
      transform: translateY(-2px);
      border-color: #d1d5db;
    }

    .card-inner {
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      letter-spacing: 0.1px;
    }

    .card-date {
      font-size: 12px;
      color: var(--text-4);
      font-weight: 400;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.35;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-3);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px 18px;
      gap: 8px;
    }

    .ticket-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-4);
      background: var(--surface);
      border: 1px solid var(--border-light);
      padding: 2px 9px;
      border-radius: 6px;
    }

    .btn-open {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
      background: var(--brand-light);
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .card:hover .btn-open { background: rgba(242,148,14,0.14); }

    /* ── EMPTY ── */
    .empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 24px;
      grid-column: 1 / -1;
      text-align: center;
      gap: 12px;
    }
    .empty-box {
      width: 52px; height: 52px;
      background: var(--surface);
      border-radius: 13px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .empty-box svg { width: 22px; height: 22px; color: var(--text-4); }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); }
    .empty-sub { font-size: 13px; color: var(--text-4); }

    /* ── FOOTER ── */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border-light);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer-mark {
      width: 18px; height: 18px;
      background: var(--brand);
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    footer span { font-size: 12px; color: var(--text-4); font-weight: 400; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">G</div>
    <span class="logo-text">GM Transport</span>
  </div>
  <span class="header-sep">/</span>
  <span class="logo-sub">Prototipos</span>
  <div class="header-end">
    <span class="count-chip" id="totalBadge">19 prototipos</span>
  </div>
</header>

<div class="page-hero">
  <h1>Prototipos</h1>
  <p>Maquetas y mockups de referencia para ERP, Mis Viajes, DobleCheck y m&aacute;s.</p>
  <div class="controls">
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6.15 6.15a7.5 7.5 0 0 0 10.5 10.5Z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Buscar&hellip;" />
    </div>
    <div class="filter-tabs">
      <button class="ftab active" data-filter="Todos">Todos</button>
      <button class="ftab" data-filter="Mis Viajes">Mis Viajes</button>
      <button class="ftab" data-filter="DobleCheck">DobleCheck</button>
      <button class="ftab" data-filter="Hermes">Hermes</button>
      <button class="ftab" data-filter="CH-439">CH-439</button>
      <button class="ftab" data-filter="Presentaciones">Presentaciones</button>
      <button class="ftab" data-filter="ERP">ERP</button>
      <button class="ftab" data-filter="Fiscal">Fiscal</button>
      <button class="ftab" data-filter="GM Integra">GM Integra</button>
      <button class="ftab" data-filter="Aeropuerto">Aeropuerto</button>
    </div>
  </div>
</div>

<div class="toolbar">
  <span id="counter">10 prototipos</span>
  <div class="sort-btns">
    <button class="sort-btn active" id="btnReciente">&#8595; Reciente</button>
    <button class="sort-btn" id="btnAntiguo">&#8593; Antiguo</button>
  </div>
</div>

<div class="grid" id="grid">
  <div class="empty" id="empty">
    <div class="empty-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 6.15 6.15a7.5 7.5 0 0 0 10.5 10.5Z"/>
      </svg>
    </div>
    <div class="empty-title">Sin resultados</div>
    <div class="empty-sub">Prueba con otro t&eacute;rmino</div>
  </div>
</div>

<footer>
  <div class="footer-mark">G</div>
  <span>GM Transport Software&reg; &nbsp;&middot;&nbsp; Prototipos internos</span>
</footer>

<script>
  const C = {
    "Mis Viajes":     { badge: "rgba(242,148,14,0.12)", text: "#92400e" },
    "DobleCheck":     { badge: "rgba(59,130,246,0.1)",  text: "#1e40af" },
    "Hermes":         { badge: "rgba(16,185,129,0.1)",  text: "#065f46" },
    "CH-439":         { badge: "rgba(139,92,246,0.1)",  text: "#5b21b6" },
    "Presentaciones": { badge: "rgba(100,116,139,0.1)", text: "#374151" },
    "ERP":            { badge: "rgba(242,148,14,0.12)", text: "#92400e" },
    "Fiscal":         { badge: "rgba(234,88,12,0.1)",  text: "#9a3412" },
    "GM Integra":     { badge: "rgba(20,184,166,0.1)", text: "#0f766e" },
    "Aeropuerto":     { badge: "rgba(14,165,233,0.1)", text: "#0369a1" },
  };
  const CD = { badge: "rgba(242,148,14,0.12)", text: "#92400e" };

  const DATA = [
    { nombre:"Compras — Generar Pasivo con Fecha Documento", ticket:"#42793", proyecto:"ERP",
      desc:"Nuevo campo Fecha Documento en la ventana Generar Pasivo. Permite registrar la fecha real de la factura del proveedor al crear el pasivo en CxP, con lectura automática desde XML.",
      url:"compras-generar-pasivo-42793/index.html", fecha:"2026-06-26" },
    { nombre:"Terminación Masiva Órdenes de Servicio", ticket:"#42840", proyecto:"ERP",
      desc:"Utilería para terminar masivamente Órdenes de Servicio activas (Abierta/Autorizada). Filtros por fecha y unidad, selección múltiple, fecha de cierre requerida y confirmación.",
      url:"mantenimiento-hu42840-terminacion-os/index.html", fecha:"2026-06-22" },
    { nombre:"Cancelación Masiva Reportes de Falla", ticket:"#42840", proyecto:"ERP",
      desc:"Utilería para cancelar masivamente Reportes de Falla en estado Pendiente (sin OS vinculada). Filtros por fecha y unidad, selección múltiple, motivo requerido y confirmación.",
      url:"mantenimiento-hu42840-cancelacion-rf/index.html", fecha:"2026-06-22" },
    { nombre:"GM Mis Viajes — Liquidaciones", ticket:"", proyecto:"Mis Viajes",
      desc:"Pantalla de liquidaciones para operadores en la app Mis Viajes.",
      url:"mis-viajes-liquidaciones-v2/index.html", fecha:"2026-07-01" },
    { nombre:"Importar Unidades v2", ticket:"#37413", proyecto:"ERP",
      desc:"Prototipo para importación masiva de unidades versión 2.",
      url:"importar-unidades-37413/index.html", fecha:"2026-06-18" },
    { nombre:"Torre de Control — Integración ControlT", ticket:"#HU39842", proyecto:"ERP",
      desc:"Configuración, tipos de viaje y listado de viajes con estatus de transmisión automática a ControlT al asignar operador.",
      url:"torre-de-control-hu39842/index.html", fecha:"2026-06-15" },
    { nombre:"Doble Check — Configuración de Envíos", ticket:"", proyecto:"DobleCheck",
      desc:"Configuración de notificaciones y envíos en formularios DobleCheck.",
      url:"doblecheck-config-envios/index.html", fecha:"2026-06-01" },
    { nombre:"GM Fiscal — Etapa 2", ticket:"", proyecto:"Fiscal",
      desc:"Prototipo de la segunda etapa del módulo GM Fiscal.",
      url:"fiscal-etapa-2/index.html", fecha:"2026-06-01" },
    { nombre:"Gestión de Combustibles Importados", ticket:"", proyecto:"GM Integra",
      desc:"Vista de gestión y seguimiento de combustibles importados en GM Integra.",
      url:"gm-integra-combustible/index.html", fecha:"2026-06-01" },
    { nombre:"SOS sin GPS", ticket:"#35074", proyecto:"Mis Viajes",
      desc:"Notificación SOS cuando el cliente no tiene GPS — correo + campanita ERP",
      url:"mis-viajes-sos/index.html", fecha:"2026-06-05" },
    { nombre:"GM Mis Viajes — Liquidaciones (v1)", ticket:"#HU41881", proyecto:"Mis Viajes",
      desc:"Primera versión del prototipo de liquidaciones para operadores.",
      url:"HU41881.html", fecha:"2026-05-08" },
    { nombre:"Pantalla Aeropuerto — Sprint 2026-5", ticket:"", proyecto:"Aeropuerto",
      desc:"Prototipo de pantalla de seguimiento en aeropuerto, sprint mayo 2026.",
      url:"pantalla-aeropuerto-sprint5/index.html", fecha:"2026-05-01" },
    { nombre:"Roadmap y Análisis IA — Transporte Personal", ticket:"", proyecto:"Aeropuerto",
      desc:"Análisis de roadmap e integración de IA para Transporte Personal.",
      url:"pantalla-aeropuerto-roadmap/index.html", fecha:"2026-05-01" },
    { nombre:"Portal Cliente + Mejoras IA", ticket:"", proyecto:"Hermes",
      desc:"Portal de cliente con mejoras de IA para cotizaciones ERP",
      url:"hermes-portal-cliente/index.html", fecha:"2026-05-01" },
    { nombre:"CH-439 Correo", ticket:"CH-439", proyecto:"CH-439",
      desc:"Variante de correo para CH-439",
      url:"CH-439-correo/index.html", fecha:"2026-04-15" },
    { nombre:"CH-439", ticket:"CH-439", proyecto:"CH-439",
      desc:"Prototipo principal CH-439",
      url:"CH-439/index.html", fecha:"2026-04-10" },
    { nombre:"Trazabilidad en Inspecciones", ticket:"", proyecto:"DobleCheck",
      desc:"Trazabilidad de inspecciones en formularios DobleCheck",
      url:"doblecheck-trazabilidad/mockup.html", fecha:"2026-03-20" },
    { nombre:"Notificaciones por Pregunta", ticket:"", proyecto:"DobleCheck",
      desc:"Notificaciones por pregunta y grupos en formularios",
      url:"doblecheck-notificaciones/DobleCheck - Notificaciones por Pregunta y Grupos - mockup.html",
      fecha:"2026-03-10" },
    { nombre:"C-TPAT Seguimiento", ticket:"", proyecto:"DobleCheck",
      desc:"Seguimiento y notificación de estatus en formularios DobleCheck",
      url:"doblecheck-ctpat-seguimiento/mockup.html", fecha:"2026-02-15" },
    { nombre:"Presentación IA GM", ticket:"", proyecto:"Presentaciones",
      desc:"Presentación ejecutiva de IA para GM Transport",
      url:"presentaciones/ia-gm/IA-GM Presentacion.html", fecha:"2026-01-20" },
    { nombre:"Kanban Guía Completa", ticket:"", proyecto:"Presentaciones",
      desc:"Guía completa de metodología Kanban para el equipo",
      url:"presentaciones/kanban/kanban-guia-completa.html", fecha:"2025-12-10" },
    { nombre:"Kanban Guía Transición", ticket:"", proyecto:"Presentaciones",
      desc:"Guía de transición a Kanban",
      url:"presentaciones/kanban/kanban-guia-transicion.html", fecha:"2025-12-10" },
  ];

  const TOTAL = DATA.length; // actualizar al agregar prototipos
  const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function fmt(iso) {
    const [y,m] = iso.split('-');
    return MESES[+m-1] + ' ' + y;
  }

  function card(p) {
    const c = C[p.proyecto] || CD;
    const ticket = p.ticket ? `<span class="ticket-tag">${p.ticket}</span>` : '<span></span>';
    return `
    <a class="card" href="${p.url}" target="_blank"
       data-proyecto="${p.proyecto}"
       data-search="${[p.nombre,p.ticket,p.desc,p.proyecto].join(' ').toLowerCase()}">
      <div class="card-inner">
        <div class="card-top">
          <span class="badge" style="background:${c.badge};color:${c.text}">${p.proyecto}</span>
          <span class="card-date">${fmt(p.fecha)}</span>
        </div>
        <div class="card-title">${p.nombre}</div>
        <div class="card-desc">${p.desc}</div>
      </div>
      <div class="card-footer">
        ${ticket}
        <button class="btn-open" tabindex="-1">Abrir &rarr;</button>
      </div>
    </a>`;
  }

  let desc = true, filter = 'Todos', q = '';
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const counter = document.getElementById('counter');

  function render() {
    let list = [...DATA].sort((a,b) => {
      const d = a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0;
      return desc ? -d : d;
    });
    if (filter !== 'Todos') list = list.filter(p => p.proyecto === filter);
    if (q) list = list.filter(p => p['data-search'] ||
      [p.nombre,p.ticket,p.desc,p.proyecto].join(' ').toLowerCase().includes(q));

    grid.querySelectorAll('.card').forEach(el => el.remove());

    if (!list.length) {
      empty.style.display = 'flex';
      counter.textContent = 'Sin resultados';
    } else {
      empty.style.display = 'none';
      list.forEach(p => grid.insertAdjacentHTML('afterbegin', card(p)));
      grid.querySelectorAll('.card').forEach(el => grid.insertBefore(el, empty));
      counter.textContent = list.length === TOTAL
        ? `${TOTAL} prototipos`
        : `${list.length} de ${TOTAL} prototipos`;
    }
  }

  render();
  document.getElementById('totalBadge').textContent = TOTAL + ' prototipos';

  document.getElementById('searchInput').addEventListener('input', e => {
    q = e.target.value.trim().toLowerCase(); render();
  });

  document.querySelectorAll('.ftab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('btnReciente').addEventListener('click', function() {
    desc = true;
    this.classList.add('active');
    document.getElementById('btnAntiguo').classList.remove('active');
    render();
  });
  document.getElementById('btnAntiguo').addEventListener('click', function() {
    desc = false;
    this.classList.add('active');
    document.getElementById('btnReciente').classList.remove('active');
    render();
  });
</script>
</body>
</html>
